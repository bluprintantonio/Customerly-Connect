openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SimpleChat API - WordPress widget messenger
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Conversation management
  - name: messages
    description: Message operations
  - name: widgets
    description: Widget configuration
  - name: widget-public
    description: Public widget endpoints (used by WordPress embed)
  - name: settings
    description: App settings (Twilio, etc.)
  - name: integrations
    description: Third-party integration webhooks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed, all]
            default: all
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/stats:
    get:
      operationId: getConversationStats
      tags: [conversations]
      summary: Get conversation stats
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationStats"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update conversation (status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationBody"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/messages:
    post:
      operationId: sendAgentMessage
      tags: [messages]
      summary: Agent sends a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets:
    get:
      operationId: listWidgets
      tags: [widgets]
      summary: List all widgets
      responses:
        "200":
          description: List of widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
    post:
      operationId: createWidget
      tags: [widgets]
      summary: Create a new widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWidgetBody"
      responses:
        "201":
          description: Widget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"

  /widgets/{id}:
    patch:
      operationId: updateWidget
      tags: [widgets]
      summary: Update widget (webhook URL, secret)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWidgetBody"
      responses:
        "200":
          description: Updated widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWidget
      tags: [widgets]
      summary: Delete a widget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsMap"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"

  /twilio/inbound:
    post:
      operationId: twilioInbound
      tags: [integrations]
      summary: Twilio inbound SMS/WhatsApp webhook
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                Body:
                  type: string
                From:
                  type: string
              required: [Body, From]
      responses:
        "200":
          description: TwiML response
          content:
            text/xml:
              schema:
                type: string

  /widget/conversations:
    post:
      operationId: widgetStartConversation
      tags: [widget-public]
      summary: Visitor starts a new conversation (public widget endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetStartConversationBody"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConversationCreated"

  /widget/conversations/{id}/messages:
    get:
      operationId: widgetGetMessages
      tags: [widget-public]
      summary: Visitor polls for messages (public widget endpoint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: since
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: widgetSendMessage
      tags: [widget-public]
      summary: Visitor sends a message (public widget endpoint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Conversation:
      type: object
      properties:
        id:
          type: integer
        visitorName:
          type: string
        visitorEmail:
          type: ["string", "null"]
        siteUrl:
          type: string
        status:
          type: string
          enum: [open, closed]
        lastMessageAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        unread:
          type: boolean
      required:
        - id
        - visitorName
        - visitorEmail
        - siteUrl
        - status
        - lastMessageAt
        - createdAt
        - updatedAt
        - unread

    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
        visitorName:
          type: string
        visitorEmail:
          type: ["string", "null"]
        siteUrl:
          type: string
        status:
          type: string
          enum: [open, closed]
        lastMessageAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        unread:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - id
        - visitorName
        - visitorEmail
        - siteUrl
        - status
        - lastMessageAt
        - createdAt
        - updatedAt
        - unread
        - messages

    ConversationStats:
      type: object
      properties:
        total:
          type: integer
        open:
          type: integer
        closed:
          type: integer
        unread:
          type: integer
      required:
        - total
        - open
        - closed
        - unread

    UpdateConversationBody:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        unread:
          type: boolean

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        content:
          type: string
        sender:
          type: string
          enum: [visitor, agent]
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - content
        - sender
        - createdAt

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    Widget:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        siteUrl:
          type: string
        apiKey:
          type: string
        agentName:
          type: ["string", "null"]
        greeting:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
          enum: ["left", "right", null]
        lang:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        webhookUrl:
          type: ["string", "null"]
        webhookSecret:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - siteUrl
        - apiKey
        - agentName
        - greeting
        - color
        - position
        - lang
        - logoUrl
        - webhookUrl
        - webhookSecret
        - createdAt

    CreateWidgetBody:
      type: object
      properties:
        name:
          type: string
        siteUrl:
          type: string
      required:
        - name
        - siteUrl

    WidgetStartConversationBody:
      type: object
      properties:
        visitorName:
          type: string
        visitorEmail:
          type: ["string", "null"]
        siteUrl:
          type: string
        apiKey:
          type: string
        initialMessage:
          type: string
      required:
        - visitorName
        - siteUrl
        - apiKey
        - initialMessage

    UpdateWidgetBody:
      type: object
      properties:
        name:
          type: string
        agentName:
          type: ["string", "null"]
        greeting:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
          enum: ["left", "right", null]
        lang:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        webhookUrl:
          type: ["string", "null"]
        webhookSecret:
          type: ["string", "null"]

    SettingsMap:
      type: object
      additionalProperties:
        type: string

    WidgetConversationCreated:
      type: object
      properties:
        conversationId:
          type: integer
        message:
          $ref: "#/components/schemas/Message"
      required:
        - conversationId
        - message
